name: Podcast maken en publiceren

# Start zodra Claude om 08:00 een nieuwe aflevering (episodes/JJJJ-MM-DD.json) in de repo zet,
# bij elke andere wijziging aan de app, of met de hand via Actions > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: podcast
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      notify: ${{ steps.audio.outputs.notify }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg klaarzetten (voor de pauzes tussen de blokken)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Audio maken met ElevenLabs
        id: audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: python tools/make_episode.py

      - name: Audio en index terugzetten in de repo
        run: |
          git config user.name "AI in een paar minuten bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio episodes
          if git diff --cached --quiet; then
            echo "Niets nieuws."
          else
            git commit -m "Audio en index $(date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Pushmelding via ntfy
        if: ${{ needs.build.outputs.notify != '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY: ${{ needs.build.outputs.notify }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "Geen NTFY_TOPIC ingesteld, geen melding."; exit 0; fi
          sleep 45  # GitHub Pages even laten bijwerken, zodat de aflevering er staat als je tikt
          python3 - <<'PY'
          import json, os, urllib.request
          n = json.loads(os.environ["NOTIFY"])
          body = {"topic": os.environ["NTFY_TOPIC"], "title": n["title"], "message": n["message"],
                  "click": os.environ.get("PAGE_URL") or "https://gboogaard.github.io/ai-nieuws-podcast/",
                  "tags": ["headphones"]}
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(body).encode("utf-8"),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY
