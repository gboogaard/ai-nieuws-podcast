name: Testmelding

# Stuurt een testmelding via ntfy. Start met de hand (Actions > Testmelding > Run workflow)
# of door tools/testmelding.txt te wijzigen.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/testmelding.txt]

jobs:
  melding:
    runs-on: ubuntu-latest
    steps:
      - name: Testmelding via ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then echo "::error::NTFY_TOPIC ontbreekt"; exit 1; fi
          python3 - <<'PY'
          import json, os, urllib.request
          body = {"topic": os.environ["NTFY_TOPIC"], "title": "Testmelding AI in een paar minuten",
                  "message": "Werkt! Vanaf nu krijg je hier een bericht zodra er een nieuwe aflevering klaarstaat.",
                  "click": "https://gboogaard.github.io/ai-nieuws-podcast/", "tags": ["headphones"]}
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(body).encode("utf-8"),
                                       headers={"Content-Type": "application/json"})
          print("ntfy:", urllib.request.urlopen(req, timeout=30).status)
          PY
