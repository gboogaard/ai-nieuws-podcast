<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI in een paar minuten</title>
<meta name="description" content="Elke ochtend in een paar minuten het belangrijkste AI-nieuws: Nederland, wereldwijd en de kansen.">
<meta name="theme-color" content="#1F0A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AI in een paar minuten">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#FFF7EF;
  --ink-2:rgba(255,247,239,.78);
  --ink-3:rgba(255,247,239,.62);
  --ground:#1F0A0C;
  --plum:#4A0F18;
  --violet:#D7263D;
  --orange:#E0303F;
  --apricot:#FF8A8A;
  --glass:rgba(255,255,255,.08);
  --glass-2:rgba(255,255,255,.14);
  --line:rgba(255,255,255,.16);
  --r:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ground);color:var(--ink)}
body{font-family:'Instrument Sans',system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--apricot)}a:hover{color:#FFC9C9}

/* achtergrond */
.sky{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(120% 80% at 50% -10%, #7A1222 0%, transparent 60%),
  linear-gradient(170deg,#2E0C12 0%,#1F0A0C 55%,#2A0D0A 100%)}
.blob{position:absolute;border-radius:50%;opacity:.55;will-change:transform;
  animation:drift 22s ease-in-out infinite alternate;transition:opacity 1.2s ease}
.b1{width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:radial-gradient(circle,#E0303F 0%,rgba(224,48,63,0) 65%)}
.b2{width:60vmax;height:60vmax;right:-25vmax;top:20vh;background:radial-gradient(circle,#E0303F 0%,rgba(224,48,63,0) 62%);animation-delay:-6s;animation-duration:26s}
.b3{width:55vmax;height:55vmax;left:5vmax;bottom:-30vmax;background:radial-gradient(circle,#A8102E 0%,rgba(168,16,46,0) 62%);animation-delay:-12s;animation-duration:30s}
@keyframes drift{
  0%{transform:translate3d(0,0,0) scale(1)}
  50%{transform:translate3d(6vmax,4vmax,0) scale(1.12)}
  100%{transform:translate3d(-4vmax,8vmax,0) scale(.95)}}
body.playing .blob{opacity:.85;animation-duration:9s}
body.playing .b2{animation-duration:11s}
body.playing .b3{animation-duration:13s}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

/* layout */
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 40px)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--violet),var(--orange));
  display:grid;place-items:center;font-family:'Instrument Serif',serif;font-size:19px;font-style:italic;box-shadow:0 6px 20px rgba(224,48,63,.35)}
.brand b{font-weight:700;font-size:18px;letter-spacing:.01em}
.brand small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.2}
.live{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--apricot);box-shadow:0 0 0 0 rgba(255,138,138,.7)}
body.playing .live i{animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,138,138,.7)}100%{box-shadow:0 0 0 10px rgba(255,138,138,0)}}

.card{background:var(--glass);border:1px solid var(--line);border-radius:var(--r);
  -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%)}

/* speler */
.player{padding:22px 20px 20px;position:relative;overflow:hidden}
.eyebrow{font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--apricot)}
.title{font-family:'Instrument Serif',serif;font-weight:400;font-size:34px;line-height:1.05;margin:8px 0 10px}
.summary{color:var(--ink-2);margin:0 0 18px;font-size:15.5px}
.engine{margin:-8px 0 16px;font-size:13px;color:var(--apricot)}

.stage{display:flex;align-items:center;gap:18px;margin:6px 0 16px}
.play{position:relative;flex:none;width:84px;height:84px;border-radius:50%;
  background:linear-gradient(140deg,#F2545F,#D7263D 50%,#9E1028);
  display:grid;place-items:center;box-shadow:0 14px 34px rgba(215,38,61,.45);transition:transform .2s ease}
.play:active{transform:scale(.94)}
.play::before,.play::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,138,138,.55);opacity:0}
body.playing .play::before{animation:ring 2.2s ease-out infinite}
body.playing .play::after{animation:ring 2.2s ease-out 1.1s infinite}
@keyframes ring{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.play svg{width:30px;height:30px}
.play .i-pause{display:none}
body.playing .play .i-play{display:none}
body.playing .play .i-pause{display:block}

.bars{flex:1;height:64px;display:flex;align-items:center;gap:4px}
.bars span{flex:1;height:100%;border-radius:4px;transform-origin:center;
  background:linear-gradient(180deg,var(--apricot),var(--orange) 45%,#9E1028);
  transform:scaleY(.12);opacity:.75;transition:transform .5s ease;
  animation:bounce var(--d) ease-in-out var(--dl) infinite alternate;animation-play-state:paused}
body.playing .bars span{animation-play-state:running;opacity:1}
@keyframes bounce{0%{transform:scaleY(.12)}100%{transform:scaleY(var(--h))}}

.progress{display:flex;flex-direction:column;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(90deg,var(--apricot) 0,var(--orange) var(--p,0%),rgba(255,255,255,.18) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-6px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--orange)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.controls{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.ctl{min-width:48px;height:48px;border-radius:14px;display:grid;place-items:center;color:var(--ink-2);font-weight:600;font-size:14px}
.ctl:active{background:var(--glass-2)}
.ctl svg{width:26px;height:26px}
.speed{padding:0 14px;border:1px solid var(--line);border-radius:999px;height:40px;font-variant-numeric:tabular-nums}

.chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:16px}
.chap{position:relative;overflow:hidden;min-height:64px;border-radius:16px;border:1px solid var(--line);padding:8px 10px;text-align:left;
  display:flex;flex-direction:column;justify-content:center;transition:background .3s ease,border-color .3s ease}
.chap small{color:var(--ink-3);font-size:12px;font-variant-numeric:tabular-nums}
.chap b{font-size:14.5px;font-weight:600}
.chap .st{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chap.on .st{color:var(--apricot);font-weight:600}
.chap.done .st{color:var(--ink-2)}
.chap .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--apricot),var(--orange));transition:width .25s linear}
.tag .len{font-weight:500;letter-spacing:0;text-transform:none;opacity:.85}
.chap.on{background:linear-gradient(135deg,rgba(215,38,61,.55),rgba(224,48,63,.45));border-color:rgba(255,138,138,.6)}

/* secties */
section{margin-top:26px}
h2{font-family:'Instrument Serif',serif;font-weight:400;font-size:26px;margin:0 0 12px}
.group{margin-bottom:14px}
.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  padding:4px 10px;border-radius:999px;margin-bottom:8px}
.tag.nl{background:rgba(242,84,95,.22);color:#FFC2C7}
.tag.wereld{background:rgba(224,48,63,.3);color:#FFC2C7}
.tag.werk{background:rgba(168,16,46,.45);color:#FFB8C8}
.tag.onderwijs{background:rgba(90,120,255,.28);color:#C9D3FF}
.tag.persoonlijk{background:linear-gradient(135deg,rgba(215,38,61,.6),rgba(224,48,63,.5));color:#FFF7EF}
.tag.kansen{background:rgba(255,255,255,.14);color:var(--ink)}
.item{padding:16px 18px;margin-bottom:10px}
.item h3{font-size:16.5px;line-height:1.3;margin:0 0 6px;font-weight:600}
.item p{margin:0 0 8px;color:var(--ink-2);font-size:15px}
.item .src{font-size:13.5px}

.archive{display:flex;flex-direction:column;gap:8px}
.ep{display:flex;align-items:center;gap:14px;padding:12px 14px;text-align:left;width:100%}
.ep .d{flex:none;width:52px;height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(150deg,rgba(215,38,61,.6),rgba(224,48,63,.5))}
.ep .d b{font-size:19px;line-height:1}
.ep .d small{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.ep .t{flex:1;min-width:0}
.ep .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep .t small{color:var(--ink-3)}
.ep.on{border-color:rgba(255,138,138,.6)}

details.card{padding:14px 18px}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-size:22px;color:var(--apricot)}
details[open] summary::after{content:"–"}
.transcript{white-space:pre-line;color:var(--ink-2);font-size:15px;margin-top:10px}

.empty{padding:26px 20px;text-align:center;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-3);text-align:center;margin-top:28px}

@media (prefers-reduced-motion: reduce){
  .blob,.bars span,.play::before,.play::after,.live i{animation:none!important}
  body.playing .bars span{transform:scaleY(.5)}
}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grain"></div></div>

<main class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">AI</div>
      <div><b>AI in een paar minuten</b><small>Dagelijks AI-nieuws</small></div>
    </div>
    <div class="live" id="today"><i></i><span>Elke ochtend 08:00</span></div>
  </header>

  <article class="card player" id="player" aria-live="polite">
    <div class="eyebrow" id="epDate">Vandaag</div>
    <h1 class="title" id="epTitle">Even laden…</h1>
    <p class="summary" id="epSummary"></p>
    <p class="engine" id="engine" style="display:none"></p>

    <div class="stage">
      <button class="play" id="playBtn" aria-label="Afspelen">
        <svg class="i-play" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
        <svg class="i-pause" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><rect x="6" y="5" width="4.2" height="14" rx="1.4"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.4"/></svg>
      </button>
      <div class="bars" id="bars" aria-hidden="true"></div>
    </div>

    <div class="progress">
      <label for="seek" style="position:absolute;left:-9999px">Positie in aflevering</label>
      <input type="range" id="seek" min="0" max="300" step="1" value="0">
      <div class="times"><span id="cur">0:00</span><span id="dur">5:00</span></div>
    </div>

    <div class="controls">
      <button class="ctl" id="back" aria-label="15 seconden terug">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><text x="12" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">15</text></svg>
      </button>
      <button class="ctl speed" id="speed" aria-label="Afspeelsnelheid">1×</button>
      <button class="ctl" id="fwd" aria-label="30 seconden vooruit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/><text x="12" y="15.2" font-size="7" text-anchor="middle" fill="currentColor" stroke="none" font-family="sans-serif" font-weight="700">30</text></svg>
      </button>
    </div>

    <div class="chapters" id="chapters"></div>
  </article>

  <section id="itemsSec">
    <h2>In deze aflevering</h2>
    <div id="items"></div>
  </section>

  <section>
    <details class="card" id="transcriptBox">
      <summary>Volledige tekst</summary>
      <div class="transcript" id="transcript"></div>
    </details>
  </section>

  <section>
    <h2>Eerdere afleveringen</h2>
    <div class="archive" id="archive"></div>
  </section>

  <p class="note" id="note">Zet deze app op je beginscherm: deelknop in Safari, dan "Zet op beginscherm".</p>
</main>

<script>
(function(){
  var SECTION = {nl:'Nederland', wereld:'Wereldwijd', werk:'Werk', onderwijs:'Onderwijs', kansen:'Kansen', persoonlijk:'Jouw kansen'};
  var DEMO = {episodes:[{
    id:'demo', date:new Date().toISOString().slice(0,10), demo:true,
    title:'Voorbeeld: zo klinkt je ochtendbulletin',
    summary:'Dit is een voorbeeldaflevering zonder audio. Vanaf de eerste ochtend om 08:00 staat hier het echte bulletin.',
    duration:300, audio:null,
    chapters:[{key:'nl',title:'Nederland',start:0},{key:'wereld',title:'Wereldwijd',start:115},{key:'kansen',title:'Kansen',start:225}],
    items:[
      {section:'nl',headline:'[Voorbeeld] Nederlands AI-nieuws van de dag',takeaway:'Kort wat er gebeurde, wat het betekent en een praktisch voorbeeld voor je werk.',source_name:'Bron',source_url:''},
      {section:'wereld',headline:'[Voorbeeld] Internationaal AI-nieuws',takeaway:'De grootste ontwikkeling wereldwijd, vertaald naar de Nederlandse praktijk.',source_name:'Bron',source_url:''},
      {section:'kansen',headline:'[Voorbeeld] Kans in de markt',takeaway:'Een concrete kans voor ondernemers of organisaties op basis van het nieuws.',source_name:'',source_url:''}
    ],
    transcript:'Goedemorgen. Dit is AI in een paar minuten, uw dagelijkse overzicht van het belangrijkste AI-nieuws.\n\nIn de echte aflevering leest u hier de volledige tekst van het bulletin.'
  }]};

  var audio = new Audio();
  audio.preload = 'metadata';
  var episodes = [], cur = null, demoT = 0, demoTimer = null, speeds = [1, 1.25, 1.5, 0.85], si = 0, lastSave = 0;

  var el = function(id){ return document.getElementById(id); };
  var store = {
    get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
  };

  // visualizer
  var bars = el('bars');
  for (var i = 0; i < 26; i++) {
    var s = document.createElement('span');
    var mid = 1 - Math.abs(i - 12.5) / 14;
    s.style.setProperty('--h', (0.35 + Math.random() * 0.4 + mid * 0.3).toFixed(2));
    s.style.setProperty('--d', (0.42 + Math.random() * 0.6).toFixed(2) + 's');
    s.style.setProperty('--dl', (-Math.random()).toFixed(2) + 's');
    bars.appendChild(s);
  }

  function fmt(t){ t = Math.max(0, Math.floor(t || 0)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
  function dayLabel(d, long){
    var dt = new Date(d + 'T08:00:00');
    return dt.toLocaleDateString('nl-NL', long ? {weekday:'long', day:'numeric', month:'long'} : {day:'numeric', month:'short'});
  }
  // Voorlezen met de iPhone-stem als een aflevering geen mp3 heeft.
  var synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  var sents = [], starts = [], totalChars = 1, sIdx = 0, speaking = false, token = 0, uttAt = 0, ticker = null, nlVoice = null, wake = null;
  function score(v){ return (/nl[-_]NL/i.test(v.lang) ? 4 : 0) + (/premium|enhanced|verbeterd|siri/i.test(v.name) ? 2 : 0) + (v.localService ? 1 : 0); }
  function pickVoice(){
    if (!synth) return;
    var vs = synth.getVoices().filter(function(v){ return /^nl/i.test(v.lang); });
    vs.sort(function(a, b){ return score(b) - score(a); });
    nlVoice = vs[0] || null;
  }
  if (synth) { pickVoice(); if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); }

  function prepSpeech(ep){
    var t = ep.transcript || ((ep.title || '') + '. ' + (ep.summary || ''));
    sents = (t.match(/[^.!?\n]+[.!?]*/g) || []).map(function(s){ return s.trim(); }).filter(Boolean);
    starts = []; var pos = 0;
    sents.forEach(function(s){ starts.push(pos); pos += s.length + 1; });
    totalChars = Math.max(1, pos);
  }
  function isSpeech(){ return !!(cur && !cur.audio); }
  function secPerChar(){ return (cur.duration || 300) / totalChars; }
  function rate(){ return {1: 1, 1.25: 1.18, 1.5: 1.35, 0.85: 0.9}[speeds[si]] || 1; }
  function duration(){ return isSpeech() ? (cur.duration || 300) : (isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (cur ? cur.duration || 300 : 300)); }
  var pendingSeek = null;
  function time(){
    if (pendingSeek != null && cur && cur.audio) return pendingSeek;
    if (!isSpeech()) return audio.currentTime;
    if (!sents.length) return 0;
    if (sIdx >= sents.length) return duration();
    var base = starts[sIdx] * secPerChar();
    if (speaking && uttAt) base += Math.min((Date.now() - uttAt) / 1000 * speeds[si], sents[sIdx].length * secPerChar());
    return base;
  }
  function playing(){ return isSpeech() ? speaking : !audio.paused; }

  function keepAwake(on){
    try {
      if (on && navigator.wakeLock && !wake) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){});
      if (!on && wake) { wake.release(); wake = null; }
    } catch(e){}
  }
  function speakNext(my){
    if (my !== token || !speaking) return;
    if (sIdx >= sents.length) { stopSpeech(); sIdx = 0; tick(); return; }
    var u = new SpeechSynthesisUtterance(sents[sIdx]);
    u.lang = 'nl-NL';
    if (nlVoice) u.voice = nlVoice;
    u.rate = rate();
    u.onstart = function(){ if (my === token) uttAt = Date.now(); };
    u.onend = function(){ if (my !== token) return; sIdx++; uttAt = 0; speakNext(my); };
    u.onerror = function(e){
      if (my !== token || (e && (e.error === 'interrupted' || e.error === 'canceled'))) return;
      stopSpeech(); // bij een echte fout stoppen in plaats van door alle zinnen te jagen
    };
    uttAt = Date.now();
    synth.speak(u);
  }
  function speakFrom(i){
    var my = ++token;
    synth.cancel();
    sIdx = Math.max(0, Math.min(i, sents.length - 1));
    speaking = true; setPlaying(true); keepAwake(true);
    if (!ticker) ticker = setInterval(tick, 250);
    setTimeout(function(){ speakNext(my); }, 60);
  }
  function stopSpeech(){
    token++; speaking = false; uttAt = 0;
    if (synth) synth.cancel();
    clearInterval(ticker); ticker = null;
    setPlaying(false); keepAwake(false);
  }
  document.addEventListener('visibilitychange', function(){ if (document.hidden && speaking) stopSpeech(); });

  function setPlaying(on){
    document.body.classList.toggle('playing', on);
    el('playBtn').setAttribute('aria-label', on ? 'Pauzeren' : 'Afspelen');
    if ('mediaSession' in navigator) navigator.mediaSession.playbackState = on ? 'playing' : 'paused';
  }

  function play(){
    if (!cur) return;
    if (isSpeech()) { if (synth && !speaking && sents.length) speakFrom(sIdx >= sents.length ? 0 : sIdx); }
    else audio.play().catch(function(){});
  }
  function pause(){
    if (isSpeech()) { if (speaking) stopSpeech(); }
    else audio.pause();
  }
  function seek(t){
    t = Math.max(0, Math.min(duration() - 0.5, t));
    if (isSpeech()) {
      var spc = secPerChar(), i = 0;
      for (var k = 0; k < starts.length; k++) if (starts[k] * spc <= t) i = k;
      if (speaking) speakFrom(i); else sIdx = i;
    } else if (audio.readyState < 1) {
      pendingSeek = t; // audio nog niet geladen: positie onthouden en toepassen zodra het kan
      audio.load();
    } else audio.currentTime = t;
    tick();
  }

  function tick(){
    var t = time(), d = duration();
    var seekEl = el('seek');
    seekEl.max = Math.round(d);
    seekEl.value = Math.round(t);
    seekEl.style.setProperty('--p', (d ? (t / d * 100) : 0) + '%');
    el('cur').textContent = fmt(t);
    el('dur').textContent = '-' + fmt(d - t);
    var chs = (cur && cur.chapters) || [], on = 0;
    for (var i = 0; i < chs.length; i++) if (t >= chs[i].start) on = i;
    var btns = el('chapters').children;
    for (var j = 0; j < btns.length; j++) {
      var c = chs[j]; if (!c) continue;
      var end = j + 1 < chs.length ? chs[j + 1].start : d, len = Math.max(1, end - c.start);
      var started = t > 0.5 || playing();
      var frac = t >= end ? 1 : (t <= c.start ? 0 : (t - c.start) / len);
      btns[j].classList.toggle('on', j === on && started);
      btns[j].querySelector('.st').textContent = fmt(len) + ' min';
      btns[j].querySelector('.bar').style.width = (started ? frac * 100 : 0) + '%';
    }
    if (cur && !isSpeech() && Date.now() - lastSave > 4000) { lastSave = Date.now(); store.set('pos:' + cur.id, String(Math.floor(t))); }
  }

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function safeUrl(u){ return /^https?:\/\//i.test(u || '') ? u : ''; }

  function select(ep, autoplay){
    pause();
    cur = ep; sIdx = 0;
    if (!ep.audio) prepSpeech(ep);
    el('epDate').textContent = (ep.id === episodes[0].id ? 'Vandaag · ' : '') + dayLabel(ep.date, true);
    el('epTitle').textContent = ep.title || 'AI in een paar minuten';
    el('epSummary').textContent = ep.summary || '';
    el('engine').textContent = ep.audio ? '' : (synth ? 'Voorgelezen door je iPhone · houd het scherm aan tijdens het luisteren' : 'Voorlezen werkt niet in deze browser; lees de volledige tekst hieronder.');
    el('engine').style.display = ep.audio ? 'none' : '';

    var ch = el('chapters'); ch.innerHTML = '';
    var nch = (ep.chapters || []).length;
    ch.style.gridTemplateColumns = 'repeat(' + (nch === 4 ? 2 : Math.max(1, Math.min(nch, 3))) + ', minmax(0, 1fr))'; // 4 = 2x2, 5-6 = 3 per rij
    (ep.chapters || []).forEach(function(c){
      var b = document.createElement('button');
      b.className = 'chap';
      b.innerHTML = '<small>' + fmt(c.start) + '</small><b>' + esc(c.title || SECTION[c.key] || '') + '</b><span class="st"></span><span class="bar"></span>';
      b.addEventListener('click', function(){ seek(c.start + 0.01); play(); });
      ch.appendChild(b);
    });

    var html = '';
    ['nl', 'wereld', 'werk', 'onderwijs', 'kansen', 'persoonlijk'].forEach(function(key){
      var list = (ep.items || []).filter(function(it){ return it.section === key; });
      if (!list.length) return;
      var cix = -1; (ep.chapters || []).forEach(function(c, i){ if (c.key === key) cix = i; });
      var clen = '';
      if (cix >= 0) {
        var cend = cix + 1 < ep.chapters.length ? ep.chapters[cix + 1].start : (ep.duration || 0);
        if (cend > ep.chapters[cix].start) clen = ' <span class="len">· ' + fmt(cend - ep.chapters[cix].start) + ' min</span>';
      }
      html += '<div class="group"><span class="tag ' + key + '">' + SECTION[key] + clen + '</span>';
      list.forEach(function(it){
        var u = safeUrl(it.source_url);
        html += '<div class="card item"><h3>' + esc(it.headline) + '</h3><p>' + esc(it.takeaway) + '</p>' +
          (u ? '<a class="src" href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(it.source_name || 'Bron') + ' ↗</a>' : '') + '</div>';
      });
      html += '</div>';
    });
    el('items').innerHTML = html;
    el('itemsSec').style.display = html ? '' : 'none';
    el('transcript').textContent = ep.transcript || '';
    el('transcriptBox').style.display = ep.transcript ? '' : 'none';

    if (ep.audio) {
      audio.src = ep.audio;
      audio.playbackRate = speeds[si];
      var saved = parseInt(store.get('pos:' + ep.id) || '0', 10);
      if (saved > 5) audio.addEventListener('loadedmetadata', function once(){ audio.removeEventListener('loadedmetadata', once); if (saved < audio.duration - 10) audio.currentTime = saved; tick(); });
    } else {
      audio.removeAttribute('src');
    }

    var arch = el('archive').children;
    for (var k = 0; k < arch.length; k++) arch[k].classList.toggle('on', arch[k].dataset.id === ep.id);

    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: ep.title || 'AI in een paar minuten',
        artist: 'AI in een paar minuten · ' + dayLabel(ep.date, true),
        album: 'AI in een paar minuten',
        artwork: [{src:'icons/icon-512.png', sizes:'512x512', type:'image/png'}, {src:'icons/icon-192.png', sizes:'192x192', type:'image/png'}]
      });
    }
    tick();
    if (autoplay) play();
  }

  function renderArchive(){
    var a = el('archive'); a.innerHTML = '';
    if (episodes.length < 2) { a.innerHTML = '<div class="card empty">Het archief vult zich elke ochtend met een nieuwe aflevering.</div>'; return; }
    episodes.forEach(function(ep){
      var dt = new Date(ep.date + 'T08:00:00');
      var b = document.createElement('button');
      b.className = 'card ep'; b.dataset.id = ep.id;
      b.innerHTML = '<div class="d"><b>' + dt.getDate() + '</b><small>' + dt.toLocaleDateString('nl-NL', {month:'short'}).replace('.', '') + '</small></div>' +
        '<div class="t"><b>' + esc(ep.title) + '</b><small>' + dt.toLocaleDateString('nl-NL', {weekday:'long'}) + ' · ' + fmt(ep.duration || 300) + '</small></div>';
      b.addEventListener('click', function(){ select(ep, true); window.scrollTo({top:0, behavior:'smooth'}); });
      a.appendChild(b);
    });
  }

  function showEmpty(){
    el('epTitle').textContent = 'De eerste aflevering komt eraan';
    el('epSummary').textContent = 'Elke ochtend om 08:00 verschijnt hier een nieuw bulletin van een paar minuten.';
    el('itemsSec').style.display = 'none';
    el('transcriptBox').style.display = 'none';
    el('playBtn').disabled = true;
  }

  // events
  el('playBtn').addEventListener('click', function(){ playing() ? pause() : play(); });
  el('back').addEventListener('click', function(){ seek(time() - 15); });
  el('fwd').addEventListener('click', function(){ seek(time() + 30); });
  el('seek').addEventListener('input', function(e){ seek(parseFloat(e.target.value)); });
  el('speed').addEventListener('click', function(){
    si = (si + 1) % speeds.length;
    audio.playbackRate = speeds[si];
    if (isSpeech() && speaking) speakFrom(sIdx);
    el('speed').textContent = String(speeds[si]).replace('.', ',') + '×';
  });
  audio.addEventListener('play', function(){ setPlaying(true); });
  audio.addEventListener('pause', function(){ setPlaying(false); if (cur) store.set('pos:' + cur.id, String(Math.floor(audio.currentTime))); });
  audio.addEventListener('ended', function(){ if (cur) store.set('pos:' + cur.id, '0'); });
  audio.addEventListener('timeupdate', tick);
  audio.addEventListener('loadedmetadata', function(){ if (pendingSeek != null) { audio.currentTime = pendingSeek; pendingSeek = null; } tick(); });

  if ('mediaSession' in navigator) {
    var ms = navigator.mediaSession;
    try {
      ms.setActionHandler('play', play);
      ms.setActionHandler('pause', pause);
      ms.setActionHandler('seekbackward', function(){ seek(time() - 15); });
      ms.setActionHandler('seekforward', function(){ seek(time() + 30); });
      ms.setActionHandler('seekto', function(d){ seek(d.seekTime); });
    } catch(e){}
  }

  // laden
  fetch('episodes/index.json?t=' + Date.now(), {cache:'no-store'})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .catch(function(){ return DEMO; })
    .then(function(data){
      episodes = (data.episodes || []).slice().sort(function(a, b){ return a.date < b.date ? 1 : -1; });
      if (!episodes.length) { showEmpty(); renderArchive(); return; }
      renderArchive();
      select(episodes[0], false);
    });

  if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude|claudeusercontent/.test(location.hostname)) {
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  if (window.navigator.standalone) el('note').style.display = 'none';
})();
</script>
</body>
</html>
